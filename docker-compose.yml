# SPARQL quickstart (#474, #716).
#
#   docker compose up                                   # full corpus (10M quads)
#   docker compose --profile sample up sample-sparql    # 14-quad fixture
#   open http://localhost:7878
#
# Which dump `docker compose up` loads (scripts/compose_fetch_dump.sh):
#   1. ESTLEG_DUMP=/path/to/dump.nq.gz       an explicit host file, if set;
#   2. release/estleg_all.nq.gz              built by
#      `python3 scripts/build_release_assets.py`, checked against
#      release/SHA256SUMS;
#   3. otherwise the tagged release asset
#      https://github.com/henrikaavik/estonian-legal-ontology/releases/download/v${ESTLEG_VERSION}/estleg_all.nq.gz
#      (ESTLEG_VERSION defaults to the ontology version), downloaded with its
#      SHA256SUMS, verified and cached in the `dumpvol` volume.
#
# Resources for the full dump: ~200 MB download, ~2.4 GB decompressed N-Quads
# in `dumpvol`, plus the Oxigraph (RocksDB) store in `store`. Oxigraph is a
# Rust binary: there is no JVM heap to size; give Docker at least 8 GB RAM and
# ~10 GB free disk for the one-off bulk load (see docs/API_GUIDE.md).
#
# Every `up` re-runs `dump` and `load` (loading is idempotent); to restart only
# the endpoint on an existing store use `docker compose up --no-deps sparql`.

x-oxigraph: &oxigraph
  image: oxigraph/oxigraph:0.4.11

x-dump-tool: &dump-tool
  image: alpine:3.20

services:
  dump:
    <<: *dump-tool
    environment:
      ESTLEG_VERSION: ${ESTLEG_VERSION:-1.0.0}
      ESTLEG_DUMP_OVERRIDE: ${ESTLEG_DUMP:+1}
    volumes:
      - ./scripts/compose_fetch_dump.sh:/usr/local/bin/compose_fetch_dump.sh:ro
      - ./release:/release:ro
      # Mounted only so ESTLEG_DUMP can point at any host file; the script
      # ignores it unless ESTLEG_DUMP is set (the fixture is never a fallback).
      - ${ESTLEG_DUMP:-./krr_outputs/exports/estleg_all_sample.nq.gz}:/override/dump.nq.gz:ro
      - dumpvol:/out
    entrypoint: ["sh", "/usr/local/bin/compose_fetch_dump.sh"]

  load:
    <<: *oxigraph
    depends_on:
      dump:
        condition: service_completed_successfully
    volumes:
      - dumpvol:/import:ro
      - store:/data
    command: ["load", "--location", "/data", "--file", "/import/dump.nq"]

  sparql:
    <<: *oxigraph
    depends_on:
      load:
        condition: service_completed_successfully
    ports:
      - "7878:7878"
    volumes:
      - store:/data
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]

  # --profile sample: the committed 7-graph fixture (14 quads), in its own
  # volumes. Name the service so the full chain above does not start too:
  #   docker compose --profile sample up sample-sparql
  sample-dump:
    <<: *dump-tool
    profiles: ["sample"]
    volumes:
      - ./krr_outputs/exports/estleg_all_sample.nq.gz:/in/dump.nq.gz:ro
      - sample-dumpvol:/out
    command: ["sh", "-c", "gzip -dc /in/dump.nq.gz > /out/dump.nq"]

  sample-load:
    <<: *oxigraph
    profiles: ["sample"]
    depends_on:
      sample-dump:
        condition: service_completed_successfully
    volumes:
      - sample-dumpvol:/import:ro
      - sample-store:/data
    command: ["load", "--location", "/data", "--file", "/import/dump.nq"]

  sample-sparql:
    <<: *oxigraph
    profiles: ["sample"]
    depends_on:
      sample-load:
        condition: service_completed_successfully
    ports:
      - "7878:7878"
    volumes:
      - sample-store:/data
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]

volumes:
  dumpvol:
  store:
  sample-dumpvol:
  sample-store:
