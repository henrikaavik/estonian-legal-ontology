name: Validate Ontology

# CI is split so docs-only PRs don't trigger the heavy SHACL matrix.
# The ``docs-light`` job below internally filters on docs/** + README.md
# so the multi-minute SHACL matrix only runs when source code, scripts,
# fixtures, shapes, or krr_outputs/ change. Docs typos finish in seconds.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'krr_outputs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'shacl/**'
      - 'mcp_server/**'
      - 'metadata.jsonld'
      - 'pyproject.toml'
      - 'constraints.txt'
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'krr_outputs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'shacl/**'
      - 'mcp_server/**'
      - 'metadata.jsonld'
      - 'pyproject.toml'
      - 'constraints.txt'
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
  # Weekly committed-artifact drift check (#479), corpus freshness gate
  # (#531/#693) and live RT schema canary (#691, one GET). Re-runs the same
  # validate/SHACL jobs against the tree on main; does not run generate_*
  # ingest. ``check_rt_staleness.py --fetch`` is operator-run.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # Fast docs-only check — markdownlint catches typos in seconds
  # rather than waiting on the multi-minute SHACL matrix walk.
  docs-light:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect docs-only changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'

      - name: Set up Node
        if: steps.filter.outputs.docs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        if: steps.filter.outputs.docs == 'true'
        run: npm install -g markdownlint-cli@0.41.0

      - name: Run markdownlint
        if: steps.filter.outputs.docs == 'true'
        # Rule set lives in .markdownlint.json at the repo root: cosmetic
        # structural rules are off (the docs predate this check); the
        # link/accessibility rules that catch real defects stay on.
        run: markdownlint 'docs/*.md' 'docs/proposals/*.md' 'README.md'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          # Cache pip downloads keyed on pyproject.toml so subsequent
          # runs reuse pyshacl + rdflib + pytest wheels (each multi-MB,
          # accounting for ~30s of per-job wall time).
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Run Ruff
        # ``mcp_server/`` is a standalone package with its own [tool.ruff]
        # config; ruff applies it hierarchically per file, so a single
        # invocation lints the corpus tooling and the MCP server together.
        # #721: the command lives in the Makefile so CI and contributors
        # share one definition of the lint paths.
        run: make lint

  pytest-matrix:
    runs-on: ubuntu-latest
    # #721: test every Python the package declares (requires-python >=3.11).
    # The other jobs stay on 3.12, the version constraints.txt was resolved on.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Run tests
        # #706: parallel; the default tier excludes `corpus` via addopts
        # (the json-validation job runs `-m corpus` with LFS materialised).
        run: python3 -m pytest -q

  # Keep the stable check context required by main's branch protection.
  # A matrix job alone publishes only names such as "pytest-matrix (3.12)".
  pytest:
    needs: pytest-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python version to pass
        env:
          MATRIX_RESULT: ${{ needs.pytest-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  mcp-server:
    name: estleg-mcp tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'mcp_server/pyproject.toml'

      # The MCP server is a separate package with its own dependency on
      # ``mcp`` (absent from the root project), so it gets its own install
      # and its tests are not discovered by the root ``testpaths = tests``.
      - name: Install estleg-mcp
        run: python3 -m pip install -e "mcp_server[dev]"

      - name: Run tests
        # Tests auto-locate the committed corpus by walking up to
        # krr_outputs/INDEX.json from inside the repo checkout.
        run: python3 -m pytest -q mcp_server

      - name: Verify MCP 1 compatibility
        run: |
          python3 -m pip install 'mcp>=1.14.0,<2'
          python3 -m pytest -q mcp_server

  # #479: exercise the integration DAG wiring without running SHACL /
  # Seadusloome (those live in json-validation). --dry-run never hits
  # the network.
  integration-dry-run:
    name: Integration DAG dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pipeline_version gate below resolves report SHAs against
          # the full history; a depth-1 clone would make every one missing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Dry-run release validate-only
        run: python3 scripts/run_all_integration.py --dry-run --release --validate-only

      # #704: every krr_outputs/reports/kov/*coverage.json pipeline_version
      # must name a commit in this repository. The frozen reports listed in
      # data/pipeline_version_baseline.json are exempt while they still carry
      # the recorded SHA; that list may only shrink.
      - name: pipeline_version resolves to a commit
        if: ${{ !cancelled() }}
        run: python3 scripts/run_all_integration.py --check-pipeline-versions

  # #479: import the ingest generators and exercise the RT-XML canary
  # plus a focused generate_all_laws slice. No live Riigi Teataja fetch.
  generator-smoke:
    name: Generator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Generator import + fixture smoke
        run: python3 -m pytest -q tests/test_rt_schema_canary.py tests/test_generate_all_laws.py --tb=line

  # #531/#693: Monday cron also fires this job. The freshness gate is
  # offline: committed snapshot stamps (laws: estleg:kehtiv; other corpora:
  # their index stamp) vs TODAY, against the per-corpus lag budgets in
  # check_rt_staleness.CORPUS_BUDGETS. It is expected to be red until the
  # corpora are refreshed: the law snapshot is 2026-05-24 against a 45-day
  # SLA, and a green result against a pinned date was meaningless (#693).
  # #691: a separate step GETs one live act from the RT public API.
  # ``--fetch`` (live per-act comparison) stays operator-run.
  rt-staleness:
    name: RT content-staleness canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      # Exit 0 = schema OK, or RT unreachable (emits a ::warning::).
      # Exit 1 = RT answered but HTML / a redirect / a different schema came
      # back: the ingest contract changed and the next refresh would break.
      - name: "Live RT schema canary (GET one act, #691)"
        if: ${{ !cancelled() }}
        run: python3 scripts/check_rt_staleness.py --schema-canary

      # #703: compare a weekly-seeded sample of 25 provisions with Riigi
      # Teataja. Exit 2 = RT unreachable (warning, not a failure).
      - name: Legal-text fidelity sample vs Riigi Teataja (#703)
        id: text_fidelity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          python3 scripts/check_text_fidelity.py --sample 25 --seed "${FIDELITY_SEED:-$(date -u +%G%V)}"
          rc=$?
          if [ "$rc" -eq 2 ]; then echo "::warning::Riigi Teataja unreachable; text fidelity not verified"; exit 0; fi
          exit "$rc"

      - name: "Corpus freshness vs today (#693)"
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if python3 scripts/check_rt_staleness.py | tee freshness.txt; then
            status=0
          else
            status=$?
          fi
          {
            echo "### Corpus freshness (#693)"
            echo
            echo "Committed snapshot stamps measured against today with the per-corpus lag budgets."
            if [ "$status" -ne 0 ]; then
              echo "**Behind SLA.** This is the honest result until the corpora are refreshed."
              echo "Remediation: refresh via the RT public-API fetch path (#691) and commit the new snapshot."
            fi
            echo
            echo '```'
            cat freshness.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Pull required LFS artifacts
        id: corpus-lfs
        run: |
          paths=(
            krr_outputs/combined_ontology.jsonld
            krr_outputs/reports/similarity_index.json
            krr_outputs/reports/eurovoc_classification.json
            krr_outputs/annotations/oiguskantsler_seisukohad.jsonld
            krr_outputs/curia/curia_combined.jsonld
            krr_outputs/eurlex/eurlex_combined.jsonld
            # #702: the overlay is LFS-tracked but was not pulled here, so
            # this gate validated a smaller corpus than a local run and
            # never saw the 37 in-file duplicate @ids it carries.
            krr_outputs/analytical/analytical_overlay.jsonld
          )
          include=$(IFS=,; echo "${paths[*]}")
          git lfs pull --include="$include" --exclude=""
          for path in "${paths[@]}"; do
            if head -n 1 "$path" | grep -qx 'version https://git-lfs.github.com/spec/v1'; then
              echo "::error file=$path::Git LFS artifact is still a pointer; check LFS bandwidth/quota"
              exit 1
            fi
          done

      # #516: the IRI namespace was migrated to https://w3id.org/estleg/. The
      # retired data.riik.ee host must not resurface anywhere (LFS artifacts are
      # materialised above, so the combined graph's content is greppable here).
      # Historical records + this migration's own doc/state are excluded, as is
      # the w3id/ redirect config whose job is to point the retired host here.
      - name: No legacy data.riik.ee namespace
        run: |
          hits=$(git grep -F -l 'data.riik.ee' -- \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)docs/superpowers/plans' \
            ':(exclude)docs/NAMESPACE_MIGRATION.md' \
            ':(exclude)data/namespace_migration_state.json' \
            ':(exclude)src/estleg/migrate_namespace.py' \
            ':(exclude)tests/test_no_legacy_namespace.py' \
            ':(exclude)w3id' \
            ':(exclude).github/workflows/validate.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Legacy data.riik.ee namespace still present (#516):"
            echo "$hits"
            exit 1
          fi

      - name: Validate JSON-LD hygiene
        run: python3 scripts/validate_all.py

      # #703: offline (~1 s). Compares legal-text coverage with
      # data/text_fidelity_baseline.json, which may only shrink.
      - name: Legal-text coverage baseline (#703)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_text_fidelity.py --coverage

      # #702: docs/VALIDATION_REPORT.md and docs/DUPLICATE_IDS_REPORT.md used
      # to be maintained by hand, and both drifted into publishing false
      # statements (a "PASSED / 0 errors" conformance claim against a red gate,
      # and a duplicate report generated from a pytest fixture). Both are now
      # generated; these checks fail the build if the committed numbers no
      # longer match the corpus. `if: always()` so the Tier 1 error backlog
      # above does not mask a stale report.
      - name: Validation report is current
        if: always()
        run: python3 scripts/generate_validation_report.py --check

      - name: Duplicate-@id report is current
        if: always()
        run: python3 scripts/generate_duplicate_ids_report.py --check

      # #591: the default `pytest` job runs without git-LFS, so the
      # `corpus`-marked real-artifact tests (combined-graph closure, version
      # non-overlap, peep-count invariants) are auto-skipped there. This job
      # has the LFS combined graph materialised and the full committed corpus
      # on disk, so opt them in here — these are the suite's only assertions
      # against the *shipped* graph rather than synthetic fixtures.
      - name: Real-corpus pytest invariants (materialised combined)
        # Run even when JSON hygiene or the namespace check failed. Otherwise
        # the Tier 1 backlog prevents the tiered release invariants from ever
        # being exercised. Still require successful LFS materialisation.
        if: ${{ !cancelled() && steps.corpus-lfs.outcome == 'success' }}
        run: python3 -m pytest -q -m corpus

  semantic-validation:
    runs-on: ubuntu-latest
    # ``kov`` walks ~11k municipal regulation peep files into a single
    # graph before pyshacl runs, so the default GitHub step timeout is
    # tight. 30 minutes leaves comfortable headroom for the largest
    # bucket while still failing fast on a genuine hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ``laws`` covers root-level ``*_peep.json`` enacted-law files
        # (indexed laws + controlled_vocabulary + ``regulations/riik/*``).
        # The ``combined_ontology.jsonld`` artifact is NOT in this bucket;
        # it is SHACL-validated by the ``seadusloome-zero-warning`` job.
        # Issue #164: combined drift is a real failure mode that would
        # otherwise slip past the per-bucket gates.
        # ``kov`` covers the municipal (KOV) regulation corpus under
        # ``krr_outputs/regulations/kov/**/*_peep.json`` plus the KOV
        # issuer/municipality registries (issue #105).
        # ``sidecars`` covers the enrichment outputs under
        # ``krr_outputs/{concepts,sanctions,amendments,institutions}/`` —
        # the only validation path for ``estleg:LegalConcept`` /
        # ``estleg:Sanction`` / ``estleg:AmendmentEvent`` /
        # ``estleg:Institution`` shaped nodes (issue #106).
        bucket: [riigikohus, drafts, eurlex, curia, laws, kov, sidecars]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Pull sidecar LFS artifacts
        if: matrix.bucket == 'sidecars'
        run: |
          path=krr_outputs/annotations/oiguskantsler_seisukohad.jsonld
          git lfs pull --include="$path" --exclude=""
          if head -n 1 "$path" | grep -qx 'version https://git-lfs.github.com/spec/v1'; then
            echo "::error file=$path::Git LFS artifact is still a pointer; check LFS bandwidth/quota"
            exit 1
          fi

      # #709: seconds, not the half hour pyshacl needs, and it names the
      # rdfs:domain / rdfs:range axiom instead of 300k symptom rows. The
      # SHACL step still runs so a red bucket keeps its full report.
      - name: No axiom types a node into a shaped class
        if: ${{ !cancelled() }}
        env:
          BUCKET: ${{ matrix.bucket }}
        run: python3 scripts/check_phantom_typing.py --bucket "$BUCKET"

      - name: Run targeted SHACL validation
        if: ${{ !cancelled() }}
        env:
          BUCKET: ${{ matrix.bucket }}
        run: python3 scripts/shacl_validate_all.py --bucket "$BUCKET"

  seadusloome-zero-warning:
    name: Seadusloome zero-warning gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -c constraints.txt

      - name: Pull public-load LFS artifacts
        run: |
          # Every LFS-tracked file on the public load surface
          # (estleg_common.PUBLIC_LOAD_SUBDIRS): the gate now passes graph
          # closure and loads all of them, so a pointer here is a load failure.
          paths=(
            krr_outputs/combined_ontology.jsonld
            krr_outputs/annotations/oiguskantsler_seisukohad.jsonld
            krr_outputs/analytical/analytical_overlay.jsonld
            krr_outputs/curia/curia_combined.jsonld
            krr_outputs/eurlex/eurlex_combined.jsonld
          )
          include=$(IFS=,; echo "${paths[*]}")
          git lfs pull --include="$include" --exclude=""
          for path in "${paths[@]}"; do
            if head -n 1 "$path" | grep -qx 'version https://git-lfs.github.com/spec/v1'; then
              echo "::error file=$path::Git LFS artifact is still a pointer; check LFS bandwidth/quota"
              exit 1
            fi
          done

      - name: Run combined-only SHACL gate (aggregate artifact, #489)
        # Validates krr_outputs/combined_ontology.jsonld ALONE — catches a stale
        # or semantically thin standalone combined that the union gate below
        # would mask by merging the public sub-directories. Fail fast here so an
        # aggregate-artifact regression is distinguishable from public-load drift.
        run: python3 scripts/validate_combined_standalone.py

      - name: Run Seadusloome zero-warning SHACL gate
        run: python3 scripts/validate_seadusloome_sync.py --report seadusloome-shacl-report.ttl

      - name: Upload SHACL report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seadusloome-shacl-report
          path: seadusloome-shacl-report.ttl
          if-no-files-found: ignore
