# #721: PEP 639 ``license`` expressions need setuptools >= 77. Without this
# table pip falls back to an unversioned setuptools and the legacy backend.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "estonian-legal-ontology"
version = "1.0.0"
description = "Generation, enrichment, and validation tooling for the Estonian Legal Ontology corpus."
requires-python = ">=3.11"
# PEP 639 (#721). The MIT licence covers the code only; the data corpus is
# not part of this package and its layered rights are set out in NOTICE.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "requests>=2.32,<3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<0.41",
  # ``beautifulsoup4`` is used by ``scripts/generate_court_decisions.py``
  # for robust HTML table parsing (issue #176). The script falls back
  # to a regex parser when bs4 is unavailable, but the production
  # path requires bs4 — declare it as a hard dependency.
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  # Pinned to the 0.16 line (#677): the ``[tool.ruff.lint] select`` below
  # holds the ruleset steady, this holds the minor version steady so a
  # 0.17 default-behaviour change cannot land unreviewed via CI.
  "ruff>=0.16,<0.17",
  "pytest-cov>=5,<8",
  # #706 test hygiene: parallel runs, a default per-test timeout and the
  # autouse no-network guard in tests/conftest.py (which requires the
  # last two and refuses to start without them).
  "pytest-xdist>=3.5,<4",
  "pytest-timeout>=2.3,<3",
  "pytest-socket>=0.7,<1",
  # Validates eval/benchmark items against item.schema.json
  # (tests/test_build_legal_benchmark.py).
  "jsonschema>=4.23,<5",
  # Workflow regression tests execute scripts parsed from the committed YAML.
  "PyYAML>=6,<7",
]
pdf = [
  "pdfminer.six>=20231228",
]
embeddings = [
  "sentence-transformers>=3,<7",
]

[project.scripts]
estleg-load = "estleg_client.cli:main"
estleg-generate-laws = "estleg.generate_all_laws:main"
estleg-run-pipeline = "estleg.run_all_integration:main"
estleg-validate = "estleg.validate_all:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/archive and examples are deliberately absent (#706): tests load
# them by path via tests/_script_loader.py.
pythonpath = [".", "src"]
# Tiers (tests/README.md): `corpus` gates are opt-in by marker expression;
# any explicit `-m ...` on the command line replaces this default.
addopts = ["-m", "not corpus"]
# pytest-timeout default; corpus/slow tests get a longer budget in conftest.
timeout = 300

[tool.coverage.run]
source = ["estleg", "estleg_client"]
omit = ["src/estleg/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the historical pycodestyle+pyflakes default. Ruff 0.16 broadened
# implicit defaults; this repo is not on that ruleset.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
# Producer package under src/estleg (#472) plus the thin read-only
# consumer package (#551). Integrators ``from estleg_client import
# load_law``; operators run ``estleg-generate-laws`` /
# ``estleg-run-pipeline`` / ``estleg-validate``. Do not add
# ``packages = ['scripts']`` — scripts/ now holds one-release shims.
packages = ["estleg", "estleg_client"]

[tool.setuptools.package-dir]
estleg = "src/estleg"

[tool.setuptools.package-data]
# PEP 561 marker: estleg_client ships inline type hints.
estleg_client = ["py.typed"]
