[project]
name = "estonian-legal-ontology"
version = "0.1.0"
description = "Generation, enrichment, and validation tooling for the Estonian Legal Ontology corpus."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<0.32",
  # ``beautifulsoup4`` is used by ``scripts/generate_court_decisions.py``
  # for robust HTML table parsing (issue #176). The script falls back
  # to a regex parser when bs4 is unavailable, but the production
  # path requires bs4 — declare it as a hard dependency.
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
# This project ships scripts in ``scripts/`` rather than as an
# importable package: the entrypoints are CLI scripts that
# manipulate ``krr_outputs/`` and import each other via
# ``sys.path`` injection at the top of each test/module. The
# ``py-modules = []`` declaration tells setuptools to skip
# package discovery — without it, the editable install would
# attempt to package every top-level ``.py`` and fail because
# the layout is not a flat-package.
#
# Decision (issue #164 follow-up): keep the ``py-modules = []``
# policy. Promoting ``scripts/`` to a real package
# (``packages = ['scripts']`` + ``scripts/__init__.py``) would
# require updating every ``sys.path`` injection site and every
# ``from generate_X import Y`` to ``from scripts.generate_X
# import Y`` — out of scope for the ontology-review remediation.
# Revisit only if/when the project starts shipping importable
# helpers to other consumers.
py-modules = []
