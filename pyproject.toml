[project]
name = "estonian-legal-ontology"
version = "0.1.0"
description = "Generation, enrichment, and validation tooling for the Estonian Legal Ontology corpus."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
