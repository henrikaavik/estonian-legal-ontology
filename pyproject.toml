[project]
name = "estonian-legal-ontology"
version = "1.0.0"
description = "Generation, enrichment, and validation tooling for the Estonian Legal Ontology corpus."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<0.41",
  # ``beautifulsoup4`` is used by ``scripts/generate_court_decisions.py``
  # for robust HTML table parsing (issue #176). The script falls back
  # to a regex parser when bs4 is unavailable, but the production
  # path requires bs4 — declare it as a hard dependency.
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "pytest-cov>=5,<8",
]
pdf = [
  "pdfminer.six>=20231228",
]
embeddings = [
  "sentence-transformers>=3,<4",
]

[project.scripts]
estleg-load = "estleg_client.cli:main"
estleg-generate-laws = "estleg.generate_all_laws:main"
estleg-run-pipeline = "estleg.run_all_integration:main"
estleg-validate = "estleg.validate_all:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts/archive", "examples"]

[tool.coverage.run]
source = ["estleg", "estleg_client"]
omit = ["src/estleg/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the historical pycodestyle+pyflakes default. Ruff 0.16 broadened
# implicit defaults; this repo is not on that ruleset.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
# Producer package under src/estleg (#472) plus the thin read-only
# consumer package (#551). Integrators ``from estleg_client import
# load_law``; operators run ``estleg-generate-laws`` /
# ``estleg-run-pipeline`` / ``estleg-validate``. Do not add
# ``packages = ['scripts']`` — scripts/ now holds one-release shims.
packages = ["estleg", "estleg_client"]

[tool.setuptools.package-dir]
estleg = "src/estleg"
