[project]
name = "estonian-legal-ontology"
version = "0.11.0"
description = "Generation, enrichment, and validation tooling for the Estonian Legal Ontology corpus."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<0.32",
  # ``beautifulsoup4`` is used by ``scripts/generate_court_decisions.py``
  # for robust HTML table parsing (issue #176). The script falls back
  # to a regex parser when bs4 is unavailable, but the production
  # path requires bs4 — declare it as a hard dependency.
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "pytest-cov>=5,<8",
]
pdf = [
  "pdfminer.six>=20231228",
]

[project.scripts]
estleg-load = "estleg_client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["scripts", "estleg_client"]
omit = ["scripts/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
# Thin read-only consumer package (issue #551). Integrators can
# ``from estleg_client import load_law`` instead of reimplementing
# INDEX traversal and multi-osa assembly.
#
# ``scripts/`` is still not packaged (issue #472). Do not add
# ``packages = ['scripts']`` here — the producer CLIs keep their
# ``sys.path`` layout until that follow-up.
packages = ["estleg_client"]
